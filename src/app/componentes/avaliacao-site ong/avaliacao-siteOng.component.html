<div tabindex="0" class="container-fluid main-content">
  <div class="page-container">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-content">

        <!-- Imagem + nome -->
        <div class="dados-instituição d-flex flex-column align-items-center">
          <img
            src="\img\logo.png"
            alt="Logo"
            class="img-usuario d-inline-block align-text-top"
          />
          <a class="navbar-brand">Olá, Organização!</a>
        </div>

        <!-- Menu -->
        <ul class="nav flex-column">

          <li class="nav-item">
            <a routerLink="/pagina-ong" class="nav-link active" aria-current="page">
              Dados Instituição
            </a>
          </li>

          <li class="nav-item">
            <a routerLink="/pagina-representante" class="nav-link">
              Dados Representante da Organização
            </a>
          </li>

          <li class="nav-item">
            <a routerLink="/pagina-avaliacao-ong" class="nav-link">
              Avaliação/Comentários
            </a>
          </li>

          <li class="nav-item">
            <a routerLink="/pagina-desativarOng" class="nav-link">
              Desativar
            </a>
          </li>

          <li class="nav-item">
            <a (click)="logout()" class="nav-link" style="cursor: pointer">
              Sair
            </a>
          </li>

        </ul>

      </div>
    </div>

    <!-- Conteúdo -->
    <div class="Form">
      <form [formGroup]="AvaliacaoOngForm" (ngSubmit)="onSubmit()">
        
        <h1 class="text-center mb-4">Deixe sua avaliação sobre nós</h1>

        <!-- Mensagem -->
        <div class="mb-3">
          <textarea
            formControlName="mensagem"
            class="form-control"
            rows="5"
            placeholder="Mensagem..."
            required
          ></textarea>

          <div
            *ngIf="AvaliacaoOngForm.get('mensagem')?.invalid && AvaliacaoOngForm.get('mensagem')?.touched"
          >
            <span class="text-danger">Mensagem muito curta</span>
          </div>
        </div>

        <!-- Botão + alerta -->
        <div class="d-grid justify-content-center">
          <button
            type="submit"
            class="btn botao"
            [disabled]="AvaliacaoOngForm.invalid"
          >
            Enviar
          </button>

          <div *ngIf="showAlert" class="alert mt-3 text-center" role="alert">
            Dados enviados com sucesso!
          </div>
        </div>

      </form>
    </div>

  </div>
</div>
