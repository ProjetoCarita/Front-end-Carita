<!--Página Background-->
<div tabindex="0" class="container-fluid main-content">
  <div class="page-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-content">
        <div class="dados-instituição d-flex flex-column align-items-center">
          <img src="\img\logo.png" alt="Logo" class="img-usuario" />
          <a class="navbar-brand">Olá, Administrador!</a>
        </div>

        <ul class="nav flex-column">
          <li class="nav-item">
            <a routerLink="/dashboard" class="nav-link">Dashboard</a>
          </li>
          <li class="nav-item">
            <a routerLink="/lista-usuarios" class="nav-link">Usuários</a>
          </li>
          <li class="nav-item">
            <a routerLink="/lista-organizacoes" class="nav-link">Organizações</a>
          </li>
          <li class="nav-item">
            <a routerLink="/lista-usuarios" class="nav-link">Parceiros</a>
          </li>
          <li class="nav-item">
            <a routerLink="/pagina-desativarOng" class="nav-link">
              Ponto de Arrecadação
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/calendario" class="nav-link">Eventos</a>
          </li>
          <li class="nav-item">
            <a (click)="logout()" class="nav-link" style="cursor: pointer">
              Sair
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="container-dashboard-grafico">
      <h2 class="mb-4 text-center">Dashboard</h2>

      <div *ngIf="loading">Carregando gráfico...</div>
      <div *ngIf="error" class="text-danger">{{ error }}</div>

      <canvas
        *ngIf="!loading && !error"
        baseChart
        [data]="barChartData"
        [type]="barChartType"
        [options]="barChartOptions"
      ></canvas>
    </div>
  </div>
</div>
