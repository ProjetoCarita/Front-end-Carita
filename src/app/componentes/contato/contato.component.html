<!--Body Contato-->
<div tabindex="0" class="container-fluid body">
  <div class="row justify-content-center align-items-start min-vh-100 py-5">
    
    <!-- Seção da Imagem -->
    <div class="col-md-4 text-center mb-4">
      <div class="form-logo">
        <img src="/img/logo.png" alt="Caritá logo" class="logoForm" />
      </div>
    </div>

    <!-- Seção do Conteúdo -->
    <div class="col-md-8">
      <div class="row">
        
        <!-- Formulário de Contato -->
        <div class="col-12 mb-4">
          <div class="Form h-100">
            <form [formGroup]="ContatoForm" (ngSubmit)="onSubmit()">
              <h1 class="text-center mb-4">Formulário de Contato</h1>

              <!--Input Nome-->
              <div class="mb-3">
                <input
                  formControlName="nome"
                  type="text"
                  class="form-control"
                  placeholder="Nome Completo"
                  required
                />
                <!--Validação Nome-->
                <div
                  *ngIf="
                    ContatoForm.get('nome')?.invalid && ContatoForm.get('nome')?.touched
                  "
                >
                  <span class="text-danger">Este campo não pode estar vazio</span>
                </div>
              </div>

              <!--Input Email-->
              <div class="mb-3">
                <input
                  formControlName="email"
                  type="email"
                  class="form-control"
                  placeholder="Entre com um endereço de email válido"
                  required
                />

                <!--Validação Email-->
                <div
                  *ngIf="
                    ContatoForm.get('email')?.invalid &&
                    ContatoForm.get('email')?.touched
                  "
                >
                  <span class="text-danger">Email Inválido</span>
                </div>
              </div>

              <!--Input mensagem-->
              <div class="mb-3">
                <textarea
                  formControlName="mensagem"
                  class="form-control"
                  rows="5"
                  placeholder="Mensagem..."
                  required
                ></textarea>

                <!-- Validação Mensagem-->
                <div
                  *ngIf="
                    ContatoForm.get('mensagem')?.invalid &&
                    ContatoForm.get('mensagem')?.touched
                  "
                >
                  <span class="text-danger">Mensagem muito curta </span>
                </div>
              </div>

              <!--Botão Submit com validaçao-->
              <div class="d-grid justify-content-center">
                <button
                  type="submit"
                  class="btn botao"
                  [disabled]="ContatoForm.invalid"
                >
                  Enviar
                </button>
                
                <div
                  *ngIf="showAlert"
                  class="alert mt-3 text-center"
                  role="alert"
                >
                  Dados enviados com sucesso!
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- Questionário NPS - SEMPRE VISÍVEL -->
        <div class="col-12 mb-4">
          <div class="nps-container h-100">
            <div class="nps-card h-100">
              <div class="nps-header">
                <h3 class="nps-title">Avalie nosso site</h3>
              </div>
              
              <div class="nps-body">
                <app-nps-survey 
                  [categoria]="'contato'"
                  [exibirComoModal]="false"
                  [tituloPersonalizado]="'EM UMA ESCALA DE 0 A 10, O QUANTO VOCÊ INDICARIA O NOSSO SITE PARA UM AMIGO OU COLEGA?'"
                  (closed)="onNPSConcluido()">
                </app-nps-survey>
              </div>
            </div>
          </div>

          <!-- Mensagem de agradecimento após NPS -->
          <div *ngIf="npsRespondido" class="alert alert-success mt-3 text-center" role="alert">
            Obrigado pelo seu feedback!
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
